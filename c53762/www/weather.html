<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogoda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1 class="header">Pogoda</h1>
    <div class="input-container">
        <label for="city-input" class="label">Wpisz miejscowość:</label>
        <input type="text" id="city-input" class="input-text" name="city" placeholder="np. Warszawa">
        <button id="get-weather" class="button">Sprawdź pogodę</button>
    </div>
    <div id="weather-result" class="weather-result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
